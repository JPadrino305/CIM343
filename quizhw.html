<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>

  <script src="quizhw.js" defer></script>
</head>

<body style="background-color: #eeeeee; font-family: Arial, sans-serif;">

  <div
    id="quiz-container"
    class="uk-card uk-card-default uk-card-body uk-width-1-2@m"
    style="background-color: white; max-width: 600px; margin: 40px auto; padding: 30px;"
  >

    <h1>Random Quiz</h1>

    <h2 id="question" class="uk-card-title"></h2>

    <div id="optionsForm">

      <input
        id="answer1"
        type="radio"
        name="option"
        value="Tallahassee"
        hidden
      >

      <button
        class="uk-button uk-button-default answer"
        type="button"
        value="Tallahassee"
        onclick="document.getElementById('answer1').checked = true; document.getElementById('result').textContent = 'Selected: ' + this.value;"
      >
        Tallahassee
      </button>

      <input
        id="answer2"
        type="radio"
        name="option"
        value="Florida"
        hidden
      >

      <button
        class="uk-button uk-button-default answer"
        type="button"
        value="Florida"
        onclick="document.getElementById('answer2').checked = true; document.getElementById('result').textContent = 'Selected: ' + this.value;"
      >
        Florida
      </button>

      <input
        id="answer3"
        type="radio"
        name="option"
        value="iPhone"
        hidden
      >

      <button
        class="uk-button uk-button-default answer"
        type="button"
        value="iPhone"
        onclick="document.getElementById('answer3').checked = true; document.getElementById('result').textContent = 'Selected: ' + this.value;"
      >
        iPhone
      </button>

      <input
        id="answer4"
        type="radio"
        name="option"
        value="Leonardo Dicaprio"
        hidden
      >

      <button
        class="uk-button uk-button-default answer"
        type="button"
        value="Leonardo Dicaprio"
        onclick="document.getElementById('answer4').checked = true; document.getElementById('result').textContent = 'Selected: ' + this.value;"
      >
        Leonardo Dicaprio
      </button>

      <input
        id="answer5"
        type="radio"
        name="option"
        value="blue"
        hidden
      >

      <button
        class="uk-button uk-button-default answer"
        type="button"
        value="blue"
        onclick="document.getElementById('answer5').checked = true; document.getElementById('result').textContent = 'Selected: ' + this.value;"
      >
        blue
      </button>

    </div>

    <button
      id="submit"
      type="button"
      style="background-color: green; color: white; padding: 10px 20px; border: none; margin-top: 20px;"
    >
      Submit
    </button>

    <p id="result"></p>

  </div>

</
